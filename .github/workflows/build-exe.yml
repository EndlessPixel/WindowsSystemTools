name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build with PyInstaller
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.3"

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name WindowsSystemTools `
            --add-data "commands.json;." `
            --collect-all fastui `
            --collect-all uvicorn `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.httptools_impl `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --hidden-import uvicorn.lifetime.on `
            main.py

      - name: Smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\dist\WindowsSystemTools.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/" -UseBasicParsing -TimeoutSec 5
                if ($res.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "服务未在预期时间内启动" }
            Write-Host "exe 启动并成功响应 /api/"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSystemTools-windows
          path: dist/WindowsSystemTools.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowsSystemTools.exe
          generate_release_notes: true
